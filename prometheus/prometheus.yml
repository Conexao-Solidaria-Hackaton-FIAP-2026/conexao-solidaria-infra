global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'campaigns-api'
    static_configs:
      - targets: ['campaigns-api:8080']
    metrics_path: '/metrics'

  - job_name: 'donation-worker'
    static_configs:
      - targets: ['donation-worker:9091']
    metrics_path: '/metrics'
